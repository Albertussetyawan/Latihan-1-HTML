<!DOCTYPE html>
<html>
<head>
    <title>Latihan 1</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 15px;
        }

        table {
            width: 520px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid orange;
        }

        /* HEADER */
        .header {
            height: 58px;
            background-color: #ffe5cc;
            text-align: center;
        }

        /* NAVIGASI */
        .nav {
            height: 38px;
            background-color: #d9e8fa;
            text-align: center;
        }

        /* UTAMA */
        .content {
            height: 220px;
        }

        .main {
            width: 400px;
            background-color: #f8cccc;
            padding: 25px 40px;
            vertical-align: top;
        }

        .main h1 {
            margin-top: 20px;
            font-size: 24px;
        }

        .main p {
            font-size: 13px;
            width: 300px;
        }

        /* MENU */
        .sidebar {
            width: 120px;
            background-color: #d9ead3;
            padding: 10px;
            vertical-align: middle;
        }

        .sidebar ul {
            margin-top: 10px;
            padding-left: 25px;
        }

        .sidebar li {
            font-size: 12px;
            margin-bottom: 3px;
        }

        /* FOOTER */
        .footer {
            height: 38px;
            background-color: #ffe5cc;
            text-align: center;
        }
    </style>
</head>

<body>

    <table>

        <!-- HEADER -->
        <tr>
            <td colspan="2" class="header">
                <header>
                    HEADER
                </header>
            </td>
        </tr>

        <!-- NAVIGASI -->
        <tr>
            <td colspan="2" class="nav">
                <nav>
                    NAVIGASI
                </nav>
            </td>
        </tr>

        <!-- CONTENT -->
        <tr class="content">

            <!-- MAIN -->
            <td class="main">
                <main>
                    <h1>Heading 1</h1>

                    <p>
                        Lorem ipsum dolor sit amet, consectetur
                        adipisicing elit, sed do eiusmod tempor
                        incididunt ut labore et dolore magna aliqua.
                    </p>
                </main>
            </td>

            <!-- MENU -->
            <td class="sidebar">
                <aside>
                    <strong>Menu:</strong>

                    <ul>
                        <li>Home</li>
                        <li>Berita</li>
                        <li>Layanan</li>
                        <li>Kontak</li>
                    </ul>
                </aside>
            </td>

        </tr>

        <!-- FOOTER -->
        <tr>
            <td colspan="2" class="footer">
                <footer>
                    FOOTER
                </footer>
            </td>
        </tr>

    </table>

</body>
</html>
